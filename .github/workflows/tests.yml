name: Execute Acceptance / Unit Tests

on:
  push:
    # branches:
    #   - main
    paths:
      - '**.py'
      - pyproject.toml
  pull_request:
    paths:
      - '**.py'
      - pyproject.toml

jobs:
  acceptance-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Robot Framework
      run: pip install robotframework

    - name: Run Robot Tests
      run: robot tests/atest/
